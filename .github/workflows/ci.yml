name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 16.2
        run: sudo xcode-select -s /Applications/Xcode_16.2.app
      - name: Toolchain info
        run: swift --version && uname -m
      - name: Build (warnings as errors)
        run: swift build -Xswiftc -warnings-as-errors
      - name: Test (warnings as errors)
        run: swift test -Xswiftc -warnings-as-errors
      - name: Build for iOS
        run: xcodebuild -scheme LocalFintechOCR -destination 'generic/platform=iOS' build
      - name: Verify consumer integration
        run: ./Scripts/verify-consumer.sh